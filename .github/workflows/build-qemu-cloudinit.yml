name: Build QEMU qcow2 with cloud-init

on:
  workflow_dispatch:
  push:
    branches:
      - current
      - fix-rolling-2026
    paths:
      - "qemu.yml"
      - "roles/**"
      - "templates/**"
      - "files/**"
      - ".github/workflows/build-qemu-cloudinit.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Download VyOS Stream ISO (base OS), cloud-init still sourced from public rolling repo
        run: |
          curl -fL -o /tmp/vyos-stream.iso "https://community-downloads.vyos.dev/stream/2026.03/vyos-2026.03-generic-amd64.iso"
          ls -la /tmp/vyos-stream.iso
          echo "ISO_PATH=/tmp/vyos-stream.iso" >> "$GITHUB_ENV"

      - name: Build qcow2 with cloud-init (NoCloud)
        shell: bash
        run: |
          set +e
          sudo ansible-playbook qemu.yml \
            -e disk_size=4 \
            -e iso_local="${ISO_PATH}" \
            -e grub_console=serial \
            -e cloud_init=true \
            -e cloud_init_ds=NoCloud \
            -e keep_user=true 2>&1 | tee /tmp/ansible-build.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            FAILMSG=$(grep -A80 "BUILD FAILED" /tmp/ansible-build.log | tr '\n' ' ' || true)
            if [ -z "$FAILMSG" ]; then
              FAILMSG="ansible-playbook exited $RC with no BUILD FAILED message - check ansible-build-log artifact"
            fi
            echo "::error::${FAILMSG}"
          fi
          exit $RC

      - name: Upload ansible build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansible-build-log
          path: /tmp/ansible-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Locate build output
        run: |
          echo "--- full /tmp listing ---"
          sudo ls -la /tmp/
          echo "--- searching for qcow2 ---"
          FOUND=$(sudo find /tmp -maxdepth 1 -iname "*.qcow2" 2>/dev/null | head -1)
          if [ -z "$FOUND" ]; then
            echo "No .qcow2 file found anywhere in /tmp - see listing above"
            exit 1
          fi
          echo "Found: $FOUND"
          sudo chmod a+r "$FOUND"
          echo "QCOW2_PATH=$FOUND" >> "$GITHUB_ENV"

      - name: Boot-test the qcow2 in plain QEMU (no Proxmox involved)
        run: |
          set -e
          sudo apt-get install -y qemu-system-x86
          cp "$QCOW2_PATH" /tmp/boot-test.qcow2

          if [ -e /dev/kvm ]; then
            ACCEL_OPTS="-enable-kvm -cpu host"
          else
            echo "No /dev/kvm - falling back to TCG (slower, longer timeout budget)"
            ACCEL_OPTS="-cpu qemu64"
          fi

          sudo timeout 400 qemu-system-x86_64 \
            -m 2048 -smp 2 $ACCEL_OPTS \
            -nographic \
            -drive file=/tmp/boot-test.qcow2,format=qcow2,if=virtio \
            -netdev user,id=net0 -device virtio-net-pci,netdev=net0 \
            > /tmp/boot-test.log 2>&1 &
          QEMU_PID=$!

          SUCCESS=0
          for i in $(seq 1 190); do
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              break
            fi
            if sudo grep -qiE "login:|Login Prompts|Configuration success" /tmp/boot-test.log 2>/dev/null; then
              SUCCESS=1
              break
            fi
            sleep 2
          done

          sudo kill "$QEMU_PID" 2>/dev/null || true
          wait "$QEMU_PID" 2>/dev/null || true

          echo "--- boot-test.log ---"
          sudo cat /tmp/boot-test.log || true
          echo "--- end boot-test.log ---"

          if [ "$SUCCESS" -ne 1 ]; then
            echo "::error::qcow2 never reached a login prompt in plain QEMU (no Proxmox involved) - the image itself is broken, not a Proxmox console/serial config issue"
            exit 1
          fi
          echo "Boot test passed - reached a login prompt"

      - name: Upload boot-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-log
          path: /tmp/boot-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload qcow2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyos-cloudinit-qcow2
          path: /tmp/*.qcow2
          if-no-files-found: warn
          retention-days: 14
